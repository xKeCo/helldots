name: CI

# Runs on all three long-lived branches. Gating only `main` would catch
# problems after integration, which is too late to be useful: work reaches
# `dev` first, is validated as a whole on `staging`, and only then lands on
# `main`, which is what gets published.
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changeset gate diffs against the PR base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # The coverage run executes the whole suite and fails on any failing
      # test, so a separate `npm test` step would run everything twice.
      - name: Test + coverage (gate at 80%)
        run: npm run test:coverage

      # CLAUDE.md: any change that affects the published package needs a
      # changeset. PRs that genuinely publish nothing add an empty one
      # (`npx changeset --empty`).
      - name: Changeset present
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Build
        run: npm run build

      - name: Bundle size (gate at 50 KB gzip)
        run: npm run size

      - name: Lighthouse CI (playground)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
