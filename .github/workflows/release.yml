name: Release

# Publishes to npm when a v* tag is pushed. Requires an NPM_TOKEN repo
# secret (Settings > Secrets and variables > Actions) with publish
# permission for this package.
#
# This is LIVE: the secret was configured on 2026-07-30 and v0.3.0 published
# through it. Pushing a v* tag publishes to npm for real — nothing else does,
# so pushing to any branch, main included, is safe.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: npm run size

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
