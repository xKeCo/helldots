name: Release

# Publishes to npm and opens the GitHub release when a v* tag is pushed.
# Requires an NPM_TOKEN repo secret (Settings > Secrets and variables >
# Actions) with publish permission for this package.
#
# This is LIVE: the secret was configured on 2026-07-30 and v0.3.0 published
# through it. Pushing a v* tag publishes to npm for real — nothing else does,
# so pushing to any branch, main included, is safe.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step opens the GitHub release. id-token is
      # what `npm publish --provenance` signs with.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: npm run size

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Deliberately after the publish, which is the point of no return. A
      # failure here leaves a published package with no release page — visible
      # and fixable by hand — rather than a release page for something that
      # never shipped.
      - name: Open the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # changesets writes the heading as "## 0.6.0"; entries cut by hand
          # before it carry a date ("## 0.4.0 — 2026-08-12"). So: match the
          # prefix, and stop at the next "## " rather than naming the
          # successor version, which the release being cut cannot know.
          awk -v tag="## $version" '
            index($0, tag) == 1 { f = 1; next }
            f && /^## / { exit }
            f
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag
